<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funtastic Friday - Spin Wheel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="text-center mb-6">
    <h1 class="text-4xl font-extrabold text-amber-400 tracking-wide">FUNTASTIC FRIDAY</h1>
    <p id="roleBadge" class="text-sm mt-1 px-3 py-1 bg-slate-800 rounded-full inline-block border border-slate-700 text-slate-300"></p>
  </div>

  <!-- Wheel Container -->
  <div class="relative flex items-center justify-center my-4">
    <!-- Pointer -->
    <div class="absolute -top-4 z-10 w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-t-[30px] border-t-amber-400 drop-shadow-md"></div>
    <!-- Canvas -->
    <canvas id="wheelCanvas" width="400" height="400" class="rounded-full shadow-2xl border-4 border-amber-400/30"></canvas>
  </div>

  <!-- Admin Control Button -->
  <div id="adminPanel" class="mt-6 hidden">
    <button id="spinBtn" onclick="spinWheel()" class="px-8 py-3 bg-amber-500 hover:bg-amber-400 text-slate-900 font-extrabold text-xl rounded-full shadow-lg transition-all transform active:scale-95">
      SPIN!
    </button>
  </div>

  <!-- Winner Modal -->
  <div id="winnerModal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
    <div class="bg-slate-800 border-2 border-amber-400 p-8 rounded-2xl text-center max-w-sm mx-4 shadow-2xl transform transition-all">
      <h2 class="text-2xl font-bold text-amber-400 mb-2">🎉 PEMENANG! 🎉</h2>
      <p id="winnerName" class="text-3xl font-extrabold text-white my-4"></p>
      <button onclick="closeModal()" class="mt-4 px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-semibold">Tutup</button>
    </div>
  </div>

  <script>
    // ===============================================================
    // 1. ISIKAN CONFIG FIREBASE KAMU DI SINI
    // ===============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBDN3stkGLz_2UdDCT-NQFslmjTJV0DxnA",
  authDomain: "doorprize-ff.firebaseapp.com",
  databaseURL: "https://doorprize-ff-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "doorprize-ff",
  storageBucket: "doorprize-ff.firebasestorage.app",
  messagingSenderId: "39600527053",
  appId: "1:39600527053:web:9921b3bded3c5708517b84",
  measurementId: "G-6LXHPGMR96"
};

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const spinRef = db.ref('funtasticfriday/spin');

    // Data Peserta
    const items = ["Hadiah A", "Hadiah B", "Hadiah C", "Hadiah D", "Hadiah E", "Hadiah F"];
    const colors = ["#f59e0b", "#3b82f6", "#10b981", "#ef4444", "#8b5cf6", "#ec4899"];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const numItems = items.length;
    const arcSize = (2 * Math.PI) / numItems;
    
    let currentAngle = 0;
    let isSpinning = false;
    let lastTimestamp = 0;

    // Detect Role
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('role') === 'admin';

    document.getElementById('roleBadge').innerText = isAdmin ? "Mode: Admin (Host)" : "Mode: Peserta (Viewer)";
    if (isAdmin) {
      document.getElementById('adminPanel').classList.remove('hidden');
    }

    // Draw Wheel
    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;

      for (let i = 0; i < numItems; i++) {
        const angle = currentAngle + i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
        ctx.lineTo(centerX, centerY);
        ctx.fill();

        // Text
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText(items[i], radius - 20, 5);
        ctx.restore();
      }
    }
    drawWheel();

    // Trigger Spin (Admin Only)
    function spinWheel() {
      if (isSpinning) return;
      
      const winningIndex = Math.floor(Math.random() * numItems);
      const randomRounds = 5 + Math.floor(Math.random() * 3);
      
      // Calculate target angle
      const targetAngle = (2 * Math.PI * randomRounds) + ((numItems - winningIndex - 0.5) * arcSize);

      // Send to Firebase
      spinRef.set({
        targetAngle: targetAngle,
        winner: items[winningIndex],
        timestamp: Date.now()
      });
    }

    // Listen to Firebase Updates (Both Admin & Peserta)
    spinRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && data.timestamp > lastTimestamp) {
        lastTimestamp = data.timestamp;
        animateSpin(data.targetAngle, data.winner);
      }
    });

    // Animation Logic
    function animateSpin(targetAngle, winnerName) {
      isSpinning = true;
      const startAngle = currentAngle;
      const duration = 4000; // 4 detik
      const startTime = performance.now();

      function update(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Ease out cubic formula
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
        
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(update);
        } else {
          isSpinning = false;
          showWinner(winnerName);
        }
      }
      requestAnimationFrame(update);
    }

    function showWinner(name) {
      document.getElementById('winnerName').innerText = name;
      document.getElementById('winnerModal').classList.remove('hidden');
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }

    function closeModal() {
      document.getElementById('winnerModal').classList.add('hidden');
    }
  </script>
</body>
</html>
